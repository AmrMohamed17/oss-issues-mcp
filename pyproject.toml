[project]
name = "oss-issues-mcp"
version = "0.1.0"
description = "An MCP server exposing derived, triage-oriented GitHub issue tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amr Mohammed" }]
keywords = ["mcp", "github", "issues", "triage", "llm"]
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
]

[project.scripts]
# lets users run the server with `oss-issues-mcp` after install
oss-issues-mcp = "oss_issues_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_issues_mcp"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
